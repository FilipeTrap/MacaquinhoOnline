<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floresta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-left">
        <h1>🐒 Floresta</h1>
        <p id="time" class="time">Tempo 0</p>
      </div>

      <div class="topbar-center">
        <button id="pause" type="button">❚❚ Pausar</button>
        <button id="step" type="button">Mover 1 tempo</button>
        <div class="speeds" id="speeds">
          <button type="button" class="speed" data-speed="1">1x</button>
          <button type="button" class="speed" data-speed="2">2x</button>
          <button type="button" class="speed" data-speed="3">3x</button>
          <button type="button" class="speed" data-speed="5">5x</button>
          <button type="button" class="speed" data-speed="10">10x</button>
        </div>
      </div>

      <div class="topbar-right">
        <button id="toggle-trace" type="button" class="secondary">Trace</button>
        <button id="reset" type="button" class="secondary">Reset</button>
      </div>
    </header>

    <main class="board">
      <section class="map-area">
        <div class="food-picker" id="food-picker"></div>
        <canvas id="map"></canvas>
        <p id="map-hint" class="hint">Escolha uma comida e clique no mapa para jogá-la lá.</p>
      </section>

      <aside class="sidebar" id="monkeys"></aside>
    </main>

    <div class="trace-drawer" id="trace-drawer" hidden>
      <div class="trace-drawer-head">
        <h2>Trace</h2>
        <button id="close-trace" type="button" class="secondary">✕</button>
      </div>
      <pre id="trace">Ainda não passou tempo.</pre>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
